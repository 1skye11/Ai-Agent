version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ai-agent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 15060585753
      MYSQL_DATABASE: ai-agent-station-study
    ports:
      - "13306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p15060585753"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-rag-knowledge
    ports:
      - "15432:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai-rag-knowledge"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: ai-agent-app:latest
    container_name: ai-agent-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    volumes:
      - ./config:/app/config:ro
    environment:
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -Dspring.profiles.active=prod --spring.config.location=/app/config/"

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-agent-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
