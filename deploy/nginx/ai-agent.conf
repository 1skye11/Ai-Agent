upstream ai_agent_app {
    server 127.0.0.1:8091;
    keepalive 32;
}

server {
    listen 80;
    server_name _;                          # 没域名就保持 _ ，有域名换成 your.domain.com

    access_log /var/log/nginx/ai-agent.access.log;
    error_log  /var/log/nginx/ai-agent.error.log;

    client_max_body_size 50m;

    location / {
        proxy_pass http://ai_agent_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;          # AI 接口响应可能慢
        proxy_read_timeout    300s;
    }

    location = /health {
        proxy_pass http://ai_agent_app/actuator/health;
        access_log off;
    }
}
